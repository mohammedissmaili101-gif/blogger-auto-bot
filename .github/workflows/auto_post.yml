name: Blogger Professional Bot

on:
  schedule:
    - cron: '0 */8 * * *' 
  workflow_dispatch: 

jobs:
  post_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests  # Hugging Face يحتاج فقط مكتبة requests

      - name: Run Auto Bot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }} # السيكريت الجديد
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
          MY_GMAIL: ${{ secrets.MY_GMAIL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py
