name: Blogger Professional Bot

on:
  schedule:
    - cron: '0 8 * * *'  # ينشر مرة واحدة يومياً الساعة 8 صباحاً UTC
  workflow_dispatch:

jobs:
  post_job:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq requests google-auth-oauthlib google-api-python-client

      - name: Check if Already Posted Today
        id: check_post
        run: |
          TODAY=$(date +%Y-%m-%d)
          if [ -f published_history.json ]; then
            LAST_DATE=$(python3 -c "
          import json
          with open('published_history.json', 'r') as f:
              data = json.load(f)
          posts = data if isinstance(data, list) else data.get('posts', [])
          print(posts[-1].get('date', '')[:10] if posts else '')
          " 2>/dev/null || echo "")
            if [ "$LAST_DATE" = "$TODAY" ]; then
              echo "already_posted=true" >> $GITHUB_OUTPUT
              echo "✅ تم النشر اليوم بالفعل، لا داعي للنشر مجدداً"
            else
              echo "already_posted=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "already_posted=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Auto Bot
        if: steps.check_post.outputs.already_posted == 'false'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python main.py

      - name: Commit and Push History File
        if: steps.check_post.outputs.already_posted == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add published_history.json
          git commit -m "chore: update published history [skip ci]" || echo "No changes to commit"
          git push
